    // Antique foil scratch surface: vanilla canvas + pointer events, no dependencies.

    scratchCard.setAttribute('aria-label',copy.scratchAriaLabel);

    function finishScratch(){if(!scratching)return;scratching=false;if(!scratchMoved||scratchFinished)return;const pixels=scratchCtx.getImageData(0,0,scratchCanvas.width,scratchCanvas.height).data;let cleared=0,total=0;for(let i=3;i<pixels.length;i+=32){total++;if(pixels[i]<70)cleared++}if(cleared/total>=.5)completeScratch()}
    function completeScratch(){if(scratchFinished)return;scratchFinished=true;scratchCard.classList.add('revealed');scratchCard.setAttribute('aria-label',`${copy.scratchRevealed}: ${cfg.displayDate}`);$('#scratchHint').textContent=`${copy.scratchRevealed}: ${cfg.displayDate}`}
    scratchCanvas.addEventListener('pointerdown',beginScratch);scratchCanvas.addEventListener('pointermove',moveScratch);scratchCanvas.addEventListener('pointerup',finishScratch);scratchCanvas.addEventListener('pointercancel',finishScratch);
    scratchCard.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();completeScratch()}});
    paintScratchSurface();window.addEventListener('resize',()=>{if(!scratchFinished&&!scratching)paintScratchSurface()});
    // The first intentional touch/click starts the muted inline cover playback.
    let opened=false, transitioning=false, waitingForHeroFrame=false, heroStarted=false, transitionTimer;
    let heroFrameReady=heroVideo.readyState>=2;
    const markHeroFrameReady=()=>{heroFrameReady=true};
    heroVideo.addEventListener('loadeddata',markHeroFrameReady,{once:true});
    if('requestVideoFrameCallback'in HTMLVideoElement.prototype) heroVideo.requestVideoFrameCallback(markHeroFrameReady);
    function revealHero(){
      if(transitioning)return;
      // Keep the playing cover over the hero until the hero has a decoded frame.
      if(!heroFrameReady){if(!waitingForHeroFrame){waitingForHeroFrame=true;heroVideo.addEventListener('loadeddata',()=>{waitingForHeroFrame=false;revealHero()},{once:true})}return}
      transitioning=true;
      cover.classList.add('transitioning');
      hero.classList.add('visible');
      transitionTimer=setTimeout(()=>{cover.hidden=true;},1850);
    }
    function openCover(){
      if(opened)return;
      opened=true;cover.classList.add('started');
      // Call both play methods synchronously inside the cover gesture. Muted inline playback
      // is permitted on mobile, and this starts/warms the hero behind the opaque cover.
      const coverPlay=coverVideo.play();
      if(!heroStarted){heroStarted=true;heroVideo.play().catch(()=>{heroStarted=false})}
      const unlock=()=>{document.documentElement.classList.remove('opening-locked');document.body.classList.remove('opening-locked')};
      if(coverPlay&&coverPlay.then)coverPlay.then(unlock).catch(()=>{opened=false;cover.classList.remove('started')});else unlock();
    }
    cover.addEventListener('click',openCover);
    cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCover()}});
    coverVideo.addEventListener('timeupdate',()=>{if(coverVideo.currentTime>=6.5)revealHero()});
    coverVideo.addEventListener('ended',revealHero);
    coverVideo.addEventListener('error',()=>{if(opened)revealHero()});
    const target=new Date(cfg.weddingDate).getTime(), units=copy.countdownUnits.map((label,i)=>[label,[86400,3600,60,1][i]]);
    function tick(){let left=Math.max(0,Math.floor((target-Date.now())/1000));$('#countdown').innerHTML=units.map(([label,size])=>{const n=Math.floor(left/size);left%=size;return `<div class="countdown-item"><strong>${String(n).padStart(2,'0')}</strong><span>${label}</span></div>`}).join('')}
    tick();setInterval(tick,1000);
    if('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in-view');observer.unobserve(entry.target)}}),{threshold:.14});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el))}else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in-view'));
  </script>
</body>
